<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Test Harness</title>
    <meta name="description" content="Visual test harness for the History of Earth UI with mock globe, player and timeline scale." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; }
      /* Globe placeholder: dark space plus a bright limb, to check legibility over both. */
      #globe {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 38% 46%, #f4f9ff 0 7%, #8ec5ff 16%, #2c6fbf 30%, #0d2f5c 44%, #04101f 56%, transparent 62%),
          radial-gradient(circle at 80% 20%, #1a2a44 0, #02040a 60%);
        touch-action: none;
      }
      #globe.is-bright { background: radial-gradient(circle at 50% 50%, #ffffff 0 35%, #e3efff 55%, #9cc3ff 85%); }
      .dev-tools {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border: 1px dashed #f0f;
        border-radius: 8px;
        background: rgba(40, 0, 40, 0.75);
        font: 11px system-ui, sans-serif;
        color: #fbf;
      }
      .dev-tools:not([open]) { padding: 2px 6px; }
      .dev-tools summary { cursor: pointer; }
      .dev-tools button { display: block; width: 100%; margin-top: 4px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <div id="app"></div>
    <script type="module" src="/src/dev/ui-test.ts"></script>
  </body>
</html>
